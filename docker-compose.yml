  #     SPRING_PROFILES_ACTIVE: docker
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/indiadb_games
  #     SPRING_DATASOURCE_USERNAME: indiadb_user
  #     SPRING_DATASOURCE_PASSWORD: indiadb_password
  #     SPRING_REDIS_HOST: redis
  #     SPRING_REDIS_PORT: 6379
  #     SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  #     STEAM_API_KEY: ${STEAM_API_KEY}
  #     EPIC_CLIENT_ID: ${EPIC_CLIENT_ID}
  #     EPIC_CLIENT_SECRET: ${EPIC_CLIENT_SECRET}
  #     GOG_CLIENT_ID: ${GOG_CLIENT_ID}
  #     GOG_CLIENT_SECRET: ${GOG_CLIENT_SECRET}
  #   networks:
  #     - indiadb-network
  #   volumes:
  #     - ./logs:/app/logs

volumes:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  indiadb-network:
    driver: bridge
