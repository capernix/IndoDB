# IndiaDB Games Backend Configuration

spring:
  application:
    name: games-backend
  
  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/indiadb_games
    username: indiadb_user
    password: indiadb_password
    driver-class-name: org.postgresql.Driver
    
  # JPA/Hibernate Configuration  
  jpa:
    hibernate:
      ddl-auto: validate  # Don't auto-create tables, use our SQL scripts
    show-sql: false  # Set to true for debugging SQL queries
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        
  # Redis Configuration
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    
  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: indiadb-games
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.indodb.games_backend.model"

# Server Configuration
server:
  port: 8081  # Different from Kafka UI (8080)

# Logging Configuration
logging:
  level:
    com.indodb.games_backend: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Management/Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always