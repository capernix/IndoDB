# IndiaDB Games Backend Configuration

spring:
  application:
    name: games-backend
  
  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/indiadb_games
    username: indiadb_user
    password: indiadb_password
    driver-class-name: org.postgresql.Driver
    
  # JPA/Hibernate Configuration  
  jpa:
    hibernate:
      ddl-auto: validate  # Don't auto-create tables, use our SQL scripts
    show-sql: false  # Set to true for debugging SQL queries
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        
  # Redis Configuration
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    
  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: indodb-price-alerts
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.indodb.games_backend.events"

api:
  rate-limit:
    steam:
      capacity: ${STEAM_BUCKET_CAPACITY:20}
      refill-per-second: ${STEAM_BUCKET_REFILL_PER_SECOND:0.67}
    other:
      capacity: ${OTHER_BUCKET_CAPACITY:8}
      refill-per-second: ${OTHER_BUCKET_REFILL_PER_SECOND:0.2}
  
  # Email Configuration (for price drop notifications)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8


# Server Configuration
server:
  port: 8081  # Different from Kafka UI (8080)

# Logging Configuration
logging:
  level:
    com.indodb.games_backend: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Management/Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# OpenAPI/Swagger Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    filter: true
    disable-swagger-default-url: true
  show-actuator: false
  use-fqn: false
  # Hide complex internal schemas
  packages-to-scan: com.indodb.games_backend.controller
  paths-to-match: /api/**

# External API Configuration
steam:
  api:
    key: ${STEAM_API_KEY:your_steam_api_key_here}  # Set via environment variable
    base-url: https://store.steampowered.com/api
    timeout: 10000  # 10 second timeout

itad:
  api:
    key: ${ITAD_API_KEY:your_itad_api_key_here}
    base-url: https://api.isthereanydeal.com
    timeout: 10000

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}  # Base64 encoded 256-bit key
  expiration: 86400000  # 24 hours in milliseconds

# Scheduling Configuration
price:
  fetch:
    interval: 3600000  # 1 hour in milliseconds
    batch-size: 50  # Number of games to update per batch (respects rate limits)
